<svg xmlns="http://www.w3.org/2000/svg" width="410" height="282" viewBox="0 0 410 282" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Hiragino Sans', sans-serif"><rect x="0" y="0" width="410" height="282" rx="0" fill="#e9edf2" opacity="1"/><rect x="135" y="10" width="140" height="262" rx="16" fill="#111111" opacity="1"/><rect x="141" y="18" width="128" height="246" rx="10" fill="#ffffff" opacity="1"/><text x="150" y="32" font-size="8" fill="#111111" font-weight="600" text-anchor="start" font-family="'SF Mono', Menlo, 'IBM Plex Mono', Consolas, monospace" opacity="1">9:41</text><rect x="238" y="26" width="22" height="7" rx="2" fill="#111111" opacity="1"/><text x="150" y="56" font-size="8" fill="#8a8a95" font-weight="600" text-anchor="start" opacity="1">Cell Biology · Ch. 4</text><text x="150" y="74" font-size="7.5" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">The mitochondria is the</text><text x="150" y="86" font-size="7.5" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">powerhouse of the cell. It</text><text x="150" y="98" font-size="7.5" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">produces ATP through</text><text x="150" y="110" font-size="7.5" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">cellular respiration and</text><text x="150" y="122" font-size="7.5" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">regulates metabolism.</text><rect x="147" y="138" width="116" height="62" rx="6" fill="#1f1f1f" opacity="0.96"/><text x="155" y="156" font-size="8.5" fill="#ffffff" font-weight="600" text-anchor="start" opacity="1">미토콘드리아는 세포의</text><text x="155" y="170" font-size="8.5" fill="#ffffff" font-weight="600" text-anchor="start" opacity="1">발전소다. 세포 호흡을</text><text x="155" y="184" font-size="8.5" fill="#ffffff" font-weight="600" text-anchor="start" opacity="1">통해 ATP를 만든다.</text><rect x="147" y="208" width="44" height="16" rx="8" fill="#4c8dff" opacity="1"/><text x="169" y="219" font-size="7.5" fill="#ffffff" font-weight="700" text-anchor="middle" opacity="1">번역됨</text><rect x="190" y="250" width="30" height="3" rx="2" fill="#111111" opacity="1"/></svg>