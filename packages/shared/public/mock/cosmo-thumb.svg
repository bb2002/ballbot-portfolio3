<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Hiragino Sans', sans-serif"><rect x="0" y="0" width="500" height="340" rx="0" fill="#f6f4ee" opacity="1"/><rect x="0" y="0" width="132" height="340" rx="0" fill="#ebe8e0" opacity="1"/><text x="16" y="30" font-size="13" fill="#1b1f3b" font-weight="700" text-anchor="start" opacity="1">코스모의 노트</text><rect x="8" y="45" width="116" height="26" rx="6" fill="#ffffff" opacity="1"/><text x="16" y="63" font-size="11" fill="#1b1f3b" font-weight="600" text-anchor="start" opacity="1">운영체제 5주차</text><text x="16" y="97" font-size="11" fill="#5b5b66" font-weight="400" text-anchor="start" opacity="1">선형대수 3주차</text><text x="16" y="131" font-size="11" fill="#5b5b66" font-weight="400" text-anchor="start" opacity="1">데이터베이스 2주차</text><text x="16" y="165" font-size="11" fill="#5b5b66" font-weight="400" text-anchor="start" opacity="1">컴퓨터구조 4주차</text><text x="16" y="320" font-size="11" fill="#8a8a95" font-weight="500" text-anchor="start" opacity="1">+ 새 녹음</text><text x="156" y="40" font-size="16" fill="#1b1f3b" font-weight="700" text-anchor="start" opacity="1">운영체제 5주차 · 프로세스 스케줄링</text><rect x="156" y="52" width="138" height="20" rx="10" fill="#e4f1ea" opacity="1"/><text x="166" y="66" font-size="10" fill="#2f7a57" font-weight="600" text-anchor="start" opacity="1">녹음 42:17 · 정리 완료</text><rect x="156" y="97" width="4" height="4" rx="2" fill="#1b1f3b" opacity="1"/><text x="168" y="102" font-size="11" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">선점형은 실행 중인 프로세스에서 CPU를 뺏을 수 있다</text><rect x="156" y="123" width="4" height="4" rx="2" fill="#1b1f3b" opacity="1"/><text x="168" y="128" font-size="11" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">라운드 로빈: 타임 퀀텀이 작을수록 응답이 빠르다</text><rect x="156" y="149" width="4" height="4" rx="2" fill="#1b1f3b" opacity="1"/><text x="168" y="154" font-size="11" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">우선순위 역전은 우선순위 상속으로 해결한다</text><rect x="156" y="175" width="4" height="4" rx="2" fill="#1b1f3b" opacity="1"/><text x="168" y="180" font-size="11" fill="#33333d" font-weight="400" text-anchor="start" opacity="1">다단계 피드백 큐는 I/O 중심 작업을 위로 올린다</text><rect x="156" y="228" width="328" height="88" rx="8" fill="#ffffff" stroke="#e3e0d6" stroke-width="1" opacity="1"/><text x="172" y="252" font-size="12" fill="#1b1f3b" font-weight="700" text-anchor="start" opacity="1">복습 퀴즈 3문항</text><text x="172" y="272" font-size="10" fill="#5b5b66" font-weight="400" text-anchor="start" opacity="1">Q1. 타임 퀀텀을 무한대로 두면 무엇과 같아지는가?</text><rect x="172" y="284" width="64" height="22" rx="4" fill="#1b1f3b" opacity="1"/><text x="204" y="299" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1">풀기</text><text x="470" y="299" font-size="10" fill="#8a8a95" font-weight="500" text-anchor="end" font-family="'SF Mono', Menlo, 'IBM Plex Mono', Consolas, monospace" opacity="1">1 / 3</text></svg>